name: SponsorMatch database security checks
on:
  push:
    branches: [main, secure-platform-upgrade-2026-11-25]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-pass
          POSTGRES_DB: sponsormatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sponsormatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-pass
      PGDATABASE: sponsormatch
    steps:
      - uses: actions/checkout@v4
      - name: Create Auth compatibility test fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/db-mock.sql
      - name: Apply Supabase schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Run RLS and workflow tests
        run: psql -v ON_ERROR_STOP=1 -f tests/db-security.sql
