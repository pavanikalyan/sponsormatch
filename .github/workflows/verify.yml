name: SponsorMatch verification
on:
  push:
    branches: [main, secure-platform-upgrade-2026-11-25]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run script syntax check
        run: npm run test:syntax
      - name: Run browser smoke tests
        run: npm test
